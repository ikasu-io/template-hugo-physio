# Builds the site with the same Hugo version as Ikasu's build sandbox and
# runs Lighthouse on every push and pull request. Thresholds in
# lighthouserc.json: accessibility, best practices and SEO at 95;
# performance at 90, since shared CI runners measure slower and noisier
# than a real device.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HUGO_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
          hugo version
      - run: hugo --minify
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.x autorun
